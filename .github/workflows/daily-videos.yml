name: Build and upload Gold & Bitcoin video

on:
  workflow_dispatch:
    inputs:
      video_slot:
        description: "Optional video slot"
        required: false
        default: "validate"
  schedule:
    # Daily at 7:00 PM India Standard Time (13:30 UTC)
    - cron: "30 13 * * *"

permissions:
  contents: read

concurrency:
  group: gold-bitcoin-video-${{ github.event.schedule || inputs.video_slot || 'manual' }}
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate configuration without uploading
        if: ${{ inputs.video_slot == 'validate' }}
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python -m compileall -q main.py
          python -c "import json; t=json.load(open('topics.json', encoding='utf-8')); assert t and all(len(x.get('scenes', [])) == 8 for x in t); print(f'Validated {len(t)} Hindi topics')"
          espeak-ng -v hi -w /tmp/hindi-check.wav "नमस्ते, यह सोना और बिटकॉइन की जानकारी है।"
          test -s /tmp/hindi-check.wav
          if [ -n "${YOUTUBE_TOKEN_JSON:-}" ]; then
            python -c "import os,base64,json; d=json.loads(base64.b64decode(os.environ['YOUTUBE_TOKEN_JSON'])); assert d.get('refresh_token'); print('YouTube OAuth secret is present and has a refresh token; value hidden')"
          else
            echo "::warning::YOUTUBE_TOKEN_JSON is missing; scheduled upload will fail until the repository secret is added."
          fi

      - name: Build and upload video
        if: ${{ inputs.video_slot != 'validate' }}
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          VIDEO_SLOT: ${{ inputs.video_slot || '1' }}
        run: python main.py

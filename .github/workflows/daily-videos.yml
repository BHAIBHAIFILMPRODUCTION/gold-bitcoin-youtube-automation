name: Build and upload Gold & Bitcoin video

on:
  workflow_dispatch:
    inputs:
      video_slot:
        description: "1 for morning, 2 for evening"
        required: false
        default: "1"
  schedule:
    # 09:00 and 17:00 India Standard Time (UTC is 03:30 and 11:30)
    - cron: "30 3 * * *"
    - cron: "30 11 * * *"

permissions:
  contents: read

concurrency:
  group: gold-bitcoin-video-${{ github.event.schedule || inputs.video_slot || 'manual' }}
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build and upload video
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          VIDEO_SLOT: ${{ github.event.schedule == '30 11 * * *' && '2' || inputs.video_slot || '1' }}
        run: python main.py
